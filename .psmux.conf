# =====================================================================
# psmux Configuration for Windows PowerShell
# File: ~/.psmux.conf
# =====================================================================

# Default shell (Windows PowerShell)
# If you install PowerShell 7 later, you can switch to:
# set-option -g default-shell "C:/Program Files/PowerShell/7/pwsh.exe"
set-option -g default-shell powershell

# Mouse & terminal behaviors
set -g mouse on
set -g focus-events on
set -g visual-activity off
set-option -g set-clipboard on
setw -g mode-keys vi

# Prefix key (Alt-s)
unbind -n C-b
set -g prefix M-s
bind M-s send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename off
set-option -g allow-rename off

# Pane navigation (Alt + Arrow keys without prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Window navigation (Alt + h / Alt + l without prefix)
bind -n M-h previous-window
bind -n M-l next-window

# Pane resizing (Prefix + h/j/k/l or Alt-Shift keys to avoid conflict with M-l next-window)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Quick clear history
bind -n C-K clear-history

# Zoom toggle (t or Prefix+z)
unbind z
unbind t
bind t resize-pane -Z

# Vi copy mode settings for Windows
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
